name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f gradlew ] && [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f CalmReminders/gradlew ] && [ -f CalmReminders/settings.gradle.kts ]; then
            echo "PROJECT_DIR=CalmReminders" >> "$GITHUB_ENV"
          else
            echo "ERROR: Could not find gradlew and settings.gradle.kts."
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalmReminders-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
